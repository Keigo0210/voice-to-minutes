name: iOS Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image'
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-15
          - macos-14

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test recording lifecycle and database
        run: npm test
      - name: Generate iOS project and install pods
        run: npx expo prebuild --platform ios --clean
      - name: Archive without signing
        run: |
          xcodebuild -workspace ios/VoiceToMinutes.xcworkspace -scheme VoiceToMinutes -configuration Release -sdk iphoneos -archivePath build/VoiceToMinutes.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r build/VoiceToMinutes.xcarchive/Products/Applications/VoiceToMinutes.app Payload/
          zip -qry VoiceToMinutes-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceToMinutes-unsigned.ipa
          path: VoiceToMinutes-unsigned.ipa
          if-no-files-found: error
